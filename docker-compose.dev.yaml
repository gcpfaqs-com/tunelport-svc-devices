services:
  tunelport-svc-devices-postgres:
    image: postgres:17
    container_name: tunelport-svc-devices-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tunelport-svc-devices_test
    ports:
      - "5500:5432"
    volumes:
      - tunelport-svc-devices_postgres_data:/var/lib/postgresql/data

volumes:
  tunelport-svc-devices_postgres_data:
